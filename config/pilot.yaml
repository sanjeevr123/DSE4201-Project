# Single source of truth for pilot-study parameters and random seeds.
# Nothing in src/ or scripts/ should hard-code a value that appears here —
# tune only by editing this file, and record any change in docs/decision_log.md.

seed: 0                      # global master seed (HMM init, walk_forward default)
random_seeds:
  hmm: 0
  simulation_master: 0       # used by WP2, not WP0/WP1

data:
  tickers: [SPY, IEF, GLD]
  download_start: "2004-11-18"
  auto_adjust: false
  raw_dir: data/raw
  metadata_dir: data/metadata
  manifest: data/raw/MANIFEST.txt

dates:
  estimation_start: "2004-11-18"
  estimation_end: "2009-12-31"
  pilot_forecast_start: "2010-01-01"
  pilot_forecast_end: "2015-12-31"
  locked_test_start: "2016-01-01"   # pilot code must NEVER compute anything on/after this date

portfolio:
  weights: {SPY: 0.3333333333, IEF: 0.3333333333, GLD: 0.3333333333}

model:
  n_states: 2
  window: 1260
  refit: 21
  garch_refit: 63
  hs_window: 500
  ewma_lambda: 0.94
  covariance_type: diag       # hmmlearn GaussianHMM param, as used in fit_hmm

alphas: [0.05, 0.025]

scoring:
  dm_hac_lags: null           # null => auto lag selection (matches dm_test default)
  pairs:                      # Diebold-Mariano comparison pairs
    - [D, B]                  # PRIMARY: isolates the correlation channel
    - [B, A]
    - [C, A]
    - [D, A]
    - [B, GARCHt]
    - [D, GARCHt]
    - [B, EWMA_MV]
    - [D, EWMA_MV]

audit:
  sigma_threshold: 8
  dividend_diff_tol: 1.0e-6
  ief_spot_check_n: 3

wp1_tests:
  mc_draws: 1_000_000
  mc_tolerance: 0.01

wp2:
  # 2-state Markov-switching multivariate Student-t DGP. Assets ordered
  # [equity, bond, gold] throughout (SPY-like, IEF-like, GLD-like).
  df: 6
  vol_calm: [0.0075, 0.0030, 0.0090]
  vol_stress: [0.0200, 0.0050, 0.0160]
  p_calm_calm: 0.99
  p_stress_stress: 0.97
  calm_corr: [-0.30, 0.05, 0.30]    # (eq-bond, eq-gold, bond-gold)
  scenarios:
    S0_vol_only:           [-0.30, 0.05, 0.30]
    S1_moderate_breakdown: [0.00, 0.20, 0.30]
    S2_strong_breakdown:   [0.40, 0.40, 0.30]
    S3_flight_to_quality:  [-0.55, -0.10, 0.40]
  burn_in: 1260
  test_days: 2520
  timing_reps: 10
  full_reps_alpha_05: 200
  full_reps_alpha_025: 100
  power_vs_length_scenario: S1_moderate_breakdown
  power_vs_length_years: [5, 10, 15]
  dm_power_alpha: 0.05        # one-sided D<B DM test significance level for power calcs
  checkpoint_dir: output/sim_checkpoints
